<style>

body{margin:0} img{max-width:100%} [hidden]{display:none!important}

</style>
<title>Chuchvara daftari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column app shell. Sticky header with a scrolling tab strip, content capped at 1040px,
   journal entries as ruled ledger lines, every form in one dialog sheet. Blue ballpoint ink for actions,
   red pen for debt, green for money received. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#16203a; --muted:#5a6580; --line:#dde2eb;
  --accent:#1f3fbf; --accent-ink:#ffffff; --accent-soft:#e7ecfc;
  --debt:#c12c2c; --debt-soft:#fbe8e6; --paid:#18764a; --paid-soft:#e2f4ea; --warn-soft:#fdf1d8; --warn:#8a5a00;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.06);
  --display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131f; --surface:#171e2e; --ink:#e8ecf5; --muted:#98a2b9; --line:#2a3349;
  --accent:#8ea5ff; --accent-ink:#0e131f; --accent-soft:#1e294b;
  --debt:#ff8f85; --debt-soft:#3a1e1e; --paid:#6fd39b; --paid-soft:#15301f; --warn-soft:#3a2e12; --warn:#f0c264;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark } }

/* ---------- jonli dizayn: avatar, halqa, sparkline, lenta ---------- */
:root{--hero:linear-gradient(135deg,var(--accent),var(--accent2,var(--accent)));--ok:#22a06b;--mid:#e0a100;--bad:#d9342b}
.av{--c:#5b6cff;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;background:var(--c);position:relative;font-family:var(--display);letter-spacing:.02em}
.av::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid var(--ring,transparent)}
.av.lg{width:76px;height:76px;font-size:28px} .av.lg::after{inset:-5px;border-width:3px}
.av.r-ok{--ring:var(--ok)} .av.r-mid{--ring:var(--mid)} .av.r-bad{--ring:var(--bad)}
.shopcards{display:flex;flex-direction:column;gap:10px}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;animation:rise .4s both}
.sc:active{transform:scale(.98)}
.sc:hover{transform:translateY(-2px)}
.sc .nm{font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.sc .sub{color:var(--muted);font-size:12.5px}
.sc .amt{text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc .amt small{display:block;font-weight:600;font-size:11px;color:var(--muted)}
.sc .spark{grid-column:2/4;height:30px;width:100%;display:block}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.bdg.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.bdg.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.bdg.gold{background:#ffe9a8;color:#7a5200}
.sumhead{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumhead div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.sumhead small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.sumhead b{font-family:var(--display);font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sumhead div:last-child b{font-size:15px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:0 14px 30px color-mix(in srgb,var(--accent) 30%,transparent);animation:rise .4s both}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;left:-50px;bottom:-70px;background:rgba(255,255,255,.08)}
.hero .who{display:flex;gap:16px;align-items:center;position:relative;z-index:1}
.hero .av{box-shadow:0 0 0 4px rgba(255,255,255,.25)}
.hero h1{color:#fff;font-size:26px}
.hero .who small{opacity:.85;font-size:13px;display:block}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px;position:relative;z-index:1}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:#fff;text-decoration:none;background:none;border:0;cursor:pointer;min-width:0}
.act i{font-style:normal;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);font-size:19px;backdrop-filter:blur(4px);transition:transform .15s}
.act:active i{transform:scale(.9)}
.debtcard{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);animation:rise .45s .05s both}
.debtcard small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.debtcard .big{font-family:var(--display);font-size:30px;white-space:nowrap;font-weight:800;line-height:1.1;color:var(--debt);font-variant-numeric:tabular-nums}
.debtcard .big.zero{color:var(--ok)}
.debtcard .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.donut{width:92px;height:92px;position:relative}
.donut svg{transform:rotate(-90deg)}
.donut .arc{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.donut b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;line-height:1.05;text-align:center}
.donut b small{display:block;font-size:9.5px;font-weight:600;color:var(--muted);letter-spacing:0;text-transform:none}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa .btn{flex-direction:column;min-height:78px;border-radius:18px;font-size:13px;box-shadow:var(--shadow);border-color:var(--line)}
.qa .btn i{font-style:normal;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:800}
.qa .q-d i{background:var(--accent-soft);color:var(--accent)} .qa .q-p i{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)} .qa .q-r i{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.dlist{display:flex;flex-direction:column;gap:8px}
.dl{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;box-shadow:var(--shadow)}
.dl b{font-size:14px} .dl .r{text-align:right;font-weight:800;color:var(--debt);font-variant-numeric:tabular-nums}
.dl .r small{display:block;color:var(--muted);font-weight:600;font-size:11px}
.dl .bar{grid-column:1/-1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.dl .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 60%,#fff));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.dl .age{font-size:11.5px;color:var(--muted)} .dl .age.old{color:var(--bad);font-weight:700}
.feed{position:relative;display:flex;flex-direction:column;gap:10px;padding-left:22px}
.feed::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.fi{position:relative;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer;box-shadow:var(--shadow);animation:rise .4s both}
.fi::before{content:attr(data-ic);position:absolute;left:-26px;top:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;background:var(--dot);box-shadow:0 0 0 4px var(--bg)}
.fi.k-d{--dot:var(--accent)} .fi.k-p{--dot:var(--ok)} .fi.k-r{--dot:var(--bad)} .fi.k-o{--dot:var(--muted)}
.fi .t{font-weight:700;font-size:14px} .fi .dt{font-size:11.5px;color:var(--muted);font-weight:600}
.fi .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.fi.k-d .v{color:var(--ink)} .fi.k-p .v{color:var(--ok)} .fi.k-r .v{color:var(--bad)}
.fi .d{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.fi .al{grid-column:1/-1;font-size:12px;padding:4px 8px;border-radius:8px;background:var(--bg);margin-top:4px;color:var(--ink)}
.fi .bal{font-size:11px;color:var(--muted);font-weight:600;text-align:right}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root[data-theme="dark"]{
  --bg:#0e131f; --surface:#171e2e; --ink:#e8ecf5; --muted:#98a2b9; --line:#2a3349;
  --accent:#8ea5ff; --accent-ink:#0e131f; --accent-soft:#1e294b;
  --debt:#ff8f85; --debt-soft:#3a1e1e; --paid:#6fd39b; --paid-soft:#15301f; --warn-soft:#3a2e12; --warn:#f0c264;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

/* ---------- sinov dizaynlari: html[data-skin] faqat egasining qurilmasida ---------- */
:root[data-skin="kok"]{--bg:#f4f6fb;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#e6eaf1;--accent:#2563eb;--accent2:#7c3aed;--accent-ink:#fff;--accent-soft:#eaf0ff;
  --debt:#c62828;--debt-soft:#fdeaea;--paid:#16794a;--paid-soft:#e2f4ea;--warn:#8a5a00;--warn-soft:#fdf1d8;--ok:#22a06b;--r:16px;--shadow:0 1px 2px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.06);color-scheme:light}
:root[data-skin="ilyos"]{--bg:#faf4ec;--surface:#fffdf9;--ink:#3b2418;--muted:#8a6f5c;--line:#eedfcc;--accent:#b3261e;--accent2:#e2762b;--accent-ink:#fff;--accent-soft:#f8e2d8;
  --debt:#b3261e;--debt-soft:#f9e1dc;--paid:#2e7d32;--paid-soft:#e3f1e2;--warn:#9a6400;--warn-soft:#fbefd6;--ok:#2e9d5a;--r:16px;--shadow:0 3px 12px rgba(90,45,20,.08);color-scheme:light}
:root[data-skin="ilyos"] .top{background:#b3261e;border:0}
:root[data-skin="ilyos"] .top .brand{color:#fff}
:root[data-skin="ilyos"] .top .status{color:#f7d9cf}
:root[data-skin="ilyos"] .tab{color:#f3c9bc}
:root[data-skin="ilyos"] .tab[aria-current="page"]{color:#fff;border-bottom-color:#f5c26b}
:root[data-skin="ilyos"] body::before{background:#b3261e}
:root[data-skin="tungi"]{--bg:#0c110f;--surface:#151c19;--ink:#e9f1ec;--muted:#8ea198;--line:#24302a;--accent:#22c27a;--accent2:#0e9fa0;--accent-ink:#06130c;--accent-soft:#163022;
  --debt:#ff7a6e;--debt-soft:#3a1d1a;--paid:#5fe39a;--paid-soft:#15301f;--warn:#f2c35c;--warn-soft:#352b12;--ok:#3ddc84;--r:16px;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
:root[data-skin="tungi"] body::before{background:#151c19}
:root[data-skin="tungi"] .bdg.gold{background:#3b3013;color:#f5c94e}
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.skin{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-align:left}
.skin[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.skin i{width:30px;height:30px;border-radius:50%;flex:none;background:var(--sw)}

/* ---------- do'kon sahifasi v2 ---------- */
.ic{width:20px;height:20px;flex:none}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.sgrid{display:grid;gap:18px;align-items:start}
.scol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:900px){.sgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)} .feedcol{position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto;padding-right:4px}}
.hero2{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;background:var(--hero);box-shadow:0 16px 34px color-mix(in srgb,var(--accent) 30%,transparent);display:flex;flex-direction:column;gap:16px;animation:rise .4s both;isolation:isolate}
.hero2::before{content:"";position:absolute;z-index:-1;width:260px;height:260px;border-radius:50%;right:-90px;top:-110px;background:rgba(255,255,255,.13)}
.hero2::after{content:"";position:absolute;z-index:-1;width:160px;height:160px;border-radius:50%;left:-60px;bottom:-80px;background:rgba(255,255,255,.08)}
.hero2 .hbg{position:absolute;inset:-20px;z-index:-2;background-size:cover;background-position:center;filter:blur(14px) saturate(1.3);opacity:.55}
.hero2.has-img{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 75%,#000),color-mix(in srgb,var(--accent2,var(--accent)) 70%,#000))}
.hero2 .who{display:flex;gap:16px;align-items:center}
.hero2 .wt{flex:1;min-width:0}
.hero2 h1{color:#fff;font-size:26px;line-height:1.1}
.hero2 .wt small{display:block;opacity:.85;font-size:13px;margin-top:2px}
.hero2 .av{box-shadow:0 0 0 4px rgba(255,255,255,.22)}
.stars{display:inline-block;margin-top:6px;font-size:15px;letter-spacing:2px;color:#ffd257}
.stars i{font-style:normal;color:rgba(255,255,255,.3)}
.stars.new{font-size:11px;letter-spacing:.04em;font-weight:700;background:rgba(255,255,255,.2);color:#fff;padding:2px 8px;border-radius:99px}
.camb{align-self:flex-start;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer}
.camb .ic{width:18px;height:18px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:16px;backdrop-filter:blur(6px)}
.hstats div{padding:10px 8px;text-align:center}
.hstats div+div{border-left:1px solid rgba(255,255,255,.18)}
.hstats b{display:block;font-family:var(--display);font-size:19px;line-height:1.1;white-space:nowrap}
.hstats small{font-size:11px;opacity:.85}
.acts2{display:flex;gap:8px;flex-wrap:wrap}
.act2{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.95);color:var(--accent);font-weight:700;font-size:13px;text-decoration:none;border:0;cursor:pointer;transition:transform .15s}
.act2 .ic{width:17px;height:17px}
.act2:active{transform:scale(.95)}
.act2:first-child{background:#fff;color:var(--ok)}
.qa .btn i .ic{width:19px;height:19px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;animation:rise .45s .08s both}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph .lg{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ph .lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.mchart{width:100%;height:auto;max-height:190px;display:block;overflow:visible}
.mchart .cl{font-size:10px;fill:var(--muted);font-weight:600}
.mchart .cv{font-size:8.5px;fill:var(--muted);font-weight:700}
.mchart .cb{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.minis div{display:flex;gap:8px;align-items:center;min-width:0}
.minis .ic{color:var(--accent);background:var(--accent-soft);padding:7px;width:32px;height:32px;border-radius:10px}
.minis span{min-width:0}
.minis small{display:block;font-size:10.5px;color:var(--muted)}
.minis b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi::before{content:""}
@media (max-width:420px){.minis{grid-template-columns:1fr 1fr}.minis div:last-child{grid-column:1/-1}}

.photo{display:flex;align-items:center;gap:12px}
.photo .pv{width:64px;height:64px;border-radius:50%;background:var(--accent-soft) center/cover no-repeat;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:var(--accent);font-weight:800}
.photo label.btn{cursor:pointer}
.photo input{display:none}
/* ---------- do'konlar ro'yxati v2 ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kt{position:relative;overflow:hidden;border-radius:18px;padding:14px 14px 12px;color:#fff;display:flex;flex-direction:column;gap:1px;box-shadow:var(--shadow);animation:rise .4s both}
.kt.a{background:linear-gradient(135deg,var(--accent),var(--accent2,var(--accent)))} .kt.b{background:linear-gradient(135deg,#f59e0b,#f97316)}
.kt.c{background:linear-gradient(135deg,#e11d48,#be123c)} .kt.d{background:linear-gradient(135deg,#475569,#1e293b)}
.kt::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
.kt .ki{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-bottom:6px}
.kt .ki .ic{width:18px;height:18px}
.kt small{font-size:12px;opacity:.9;font-weight:600}
.kt b{font-family:var(--display);font-size:22px;line-height:1.15;white-space:nowrap;font-variant-numeric:tabular-nums}
.kt em{font-style:normal;font-size:11.5px;opacity:.85}
.tops{display:flex;flex-direction:column;gap:6px}
.topr{display:grid;grid-template-columns:32px minmax(90px,170px) 1fr auto;gap:10px;align-items:center;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left;width:100%}
.topr .av{width:32px;height:32px;font-size:12px}
.topr .tn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topr .tb{height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.topr .tb i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#f97316,#e11d48);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.topr b{font-size:13.5px;color:var(--debt);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:600px){.topr{grid-template-columns:32px 1fr auto;row-gap:5px}.topr .av{grid-row:1/3}.topr .tb{grid-column:2/4;grid-row:2;height:8px}}
.fbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}

.status{font-size:12px;color:var(--muted);text-align:right}

.tabs-in{display:flex;gap:2px}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:26px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.head > *{min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{color:var(--muted);font-size:13px;margin:0}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}

div.row{cursor:default}
button.row:hover{background:var(--accent-soft)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}

.row-main small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}

/* tables */

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}

.kv{display:grid;grid-template-columns:1fr auto;gap:0}

.rows{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}

function viewHisobot() {

let chain = Promise.resolve();
const enqueue = fn => { const p = chain.then(fn); chain = p.catch(() => {}); return p; };
async function putRaw(coll, docId, id, val) {
  const key = coll + "/" + docId, ref = S.db.doc(key);
  if (S.known.has(key)) {
    try { await ref.update({ e: { [id]: val } }); }
    catch (err) { if (err && err.code === "invalid_argument" && val !== null && !(await ref.get()).exists) { await ref.set({ e: { [id]: val } }); } else throw err; }
  } else if (val !== null) { await ref.set({ e: { [id]: val } }); S.known.add(key); }
}
const put = (coll, docId, id, val) => enqueue(async () => {

});

  const base = ym + "_" + t;

  if (!shards.length) return base;
  const last = shards[shards.length - 1];
  return S.jSize[last] > 180000 ? base + "_" + ((+last.split("_")[2] || 1) + 1) : last;
}

      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      let q = .78, url = c.toDataURL("image/jpeg", q); while (url.length > 60000 && q > .4) { q -= .1; url = c.toDataURL("image/jpeg", q); }
      res(url); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}

  else if ("rmRrow" in ds) el.closest(".rrow").remove();

  else if ("staffSkin" in ds) { const P = PW(), on = (P.users || []).filter(u => u.ui); if (!on.length) { toast("Avval xodimga «Yangi dizayn» ni belgilang"); return; } P.setUi(on.map(u => u.uid), ds.staffSkin).then(() => toast("Xodimlar dizayni o'zgardi")).catch(() => toast("Saqlanmadi, internetni tekshiring")); }
  else if ("matOpen" in ds) { S.matId = ds.matOpen; render(); window.scrollTo(0, 0); }
  else if ("prodOpen" in ds) { S.prodId = ds.prodOpen; render(); window.scrollTo(0, 0); }
  else if ("more" in ds) { const sh = document.getElementById("bsheet"); if (sh) sh.hidden = !sh.hidden; }
  else if ("imgDel" in ds) { F.photo = "del"; const pv = $("#r-pv"); pv.style.backgroundImage = ""; pv.textContent = "—"; el.remove(); }
  else if ("addOrow" in ds) { $("#o-rows").insertAdjacentHTML("beforeend", oRow({})); }
  else if ("rmOrow" in ds) { if ($$("#o-rows .orow").length > 1) el.closest(".orow").remove(); else { $(".o-a", el.closest(".orow")).value = ""; $(".o-d", el.closest(".orow")).value = ""; } updateOTotal(); }
  else if ("rmRow" in ds) { if ($$("#frmBody .irow").length > 1) el.closest(".irow").remove(); updateTotal(); }
  else if ("export" in ds) exportCsv();
  else if ("logout" in ds) window.DAFTAR_PWA.logout();
  else if ("user" in ds) userForm(ds.user || null);
  else if ("norm" in ds) normForm(ds.norm);
  else if ("inv" in ds) invForm(ds.inv || null);
  else if ("invsel" in ds) { S.invId = ds.invsel; render(); }
  else if ("reloadLog" in ds) { loadLog(); render(); }
  else if ("geo" in ds) {
    const er = $("#frmErr"), label = el.textContent, fail = () => { el.disabled = false; el.textContent = label; er.textContent = "Joylashuvni aniqlab bo'lmadi. Telefonda joylashuvga ruxsat bering yoki xarita havolasini qo'ying."; er.hidden = false; };
    if (!navigator.geolocation) return fail();
    el.disabled = true; el.textContent = "Aniqlanmoqda…";
    navigator.geolocation.getCurrentPosition(pos => { $("#r-loc").value = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6); el.disabled = false; el.textContent = label; er.hidden = true; }, fail, { enableHighAccuracy: true, timeout: 15000 });
  }
  else if ("copy" in ds) {
    try { await navigator.clipboard.writeText(ds.copy); toast("Nusxa olindi"); }
    catch (e) { const c = el.parentElement.querySelector("code"); if (c) { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Raqam belgilandi, nusxa oling"); }
  }
  else if ("del" in ds) {
    if (!F || !F.onDelete) return;
    if (!ds.armed) { ds.armed = "1"; el.textContent = "Rostdan ham? Yana bir marta bosing"; return; }
    el.disabled = true;
    try { await F.onDelete(); dlg.close(); toast("O'chirildi"); render(); }
    catch (err) { const er = $("#frmErr"); er.textContent = errText(err); er.hidden = false; }
    el.disabled = false;
  }
});
document.addEventListener("change", ev => { if (ev.target.id === "dayPick" && ev.target.value) { S.day = ev.target.value; render(); } if (ev.target.id === "logWho") { S.logWho = ev.target.value; render(); } if (ev.target.id === "srtSel") { S.srt = ev.target.value; render(); } });
document.addEventListener("input", ev => { if (ev.target.id === "shopSearch") { S.q = ev.target.value; $("#shopList").innerHTML = shopRows(S.view === "firma" ? "fshops" : "shops"); if (JON()) countUp($("#shopList")); } });
window.addEventListener("hashchange", () => { const hv = location.hash.slice(1); if (VIEWFN[hv] && VIEWOK[hv]() && hv !== S.view) { S.view = hv; S.shopId = S.fshopId = S.fbrId = S.workerId = null; render(); } });
start();
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
