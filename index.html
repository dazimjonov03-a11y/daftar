<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#171e2e" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

<title>Chuchvara daftari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column app shell. Sticky header with a scrolling tab strip, content capped at 1040px,
   journal entries as ruled ledger lines, every form in one dialog sheet. Blue ballpoint ink for actions,
   red pen for debt, green for money received. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#16203a; --muted:#5a6580; --line:#dde2eb;
  --accent:#1f3fbf; --accent-ink:#ffffff; --accent-soft:#e7ecfc;
  --debt:#c12c2c; --debt-soft:#fbe8e6; --paid:#18764a; --paid-soft:#e2f4ea; --warn-soft:#fdf1d8; --warn:#8a5a00;
  --shadow:0 1px 2px rgba(22,32,58,.06),0 8px 24px rgba(22,32,58,.06);
  --display:"Bricolage Grotesque","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131f; --surface:#171e2e; --ink:#e8ecf5; --muted:#98a2b9; --line:#2a3349;
  --accent:#8ea5ff; --accent-ink:#0e131f; --accent-soft:#1e294b;
  --debt:#ff8f85; --debt-soft:#3a1e1e; --paid:#6fd39b; --paid-soft:#15301f; --warn-soft:#3a2e12; --warn:#f0c264;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131f; --surface:#171e2e; --ink:#e8ecf5; --muted:#98a2b9; --line:#2a3349;
  --accent:#8ea5ff; --accent-ink:#0e131f; --accent-soft:#1e294b;
  --debt:#ff8f85; --debt-soft:#3a1e1e; --paid:#6fd39b; --paid-soft:#15301f; --warn-soft:#3a2e12; --warn:#f0c264;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.status{font-size:12px;color:var(--muted);text-align:right}
.status.bad{color:var(--debt)}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs-in{display:flex;gap:2px}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-size:26px;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.head > *{min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.hint{color:var(--muted);font-size:13px;margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--debt)}
.btn.small{min-height:34px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{width:42px;min-width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{min-width:120px;text-align:center}
.stepper input{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}

/* debt banner */
.banner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.banner small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-weight:600}
.banner .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.1}
.banner .side{font-size:13px;opacity:.9}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.quick .btn{justify-content:flex-start;text-align:left}
.quick .btn i{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.tile b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}

/* ledger list */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
div.row{cursor:default}
button.row:hover{background:var(--accent-soft)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-main b{font-weight:600;overflow-wrap:anywhere}
.row-main small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row-val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row-val small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.debt{color:var(--debt)} .paid{color:var(--paid)} .muted{color:var(--muted)}
.pill{flex:none;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);min-width:62px;text-align:center}
.pill.t-p,.pill.t-m{background:var(--paid-soft);color:var(--paid)}
.pill.t-r,.pill.t-x,.pill.t-v{background:var(--debt-soft);color:var(--debt)}
.pill.t-b,.pill.t-u,.pill.t-w{background:var(--warn-soft);color:var(--warn)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}

/* tables */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{font-weight:700;background:var(--accent-soft)}
.kv{display:grid;grid-template-columns:1fr auto;gap:0}
.kv > div{padding:10px 14px;border-bottom:1px solid var(--line)}
.kv > div:nth-last-child(-n+2){border-bottom:0}
.kv .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .strong{background:var(--accent-soft)}
.kv .v{white-space:normal}
.kv .qty{display:inline-block;margin-right:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--accent)}
.info{display:flex;flex-direction:column;gap:4px}
.info span{color:var(--muted)}
.phone{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.phone code{font-family:inherit;font-weight:600;font-variant-numeric:tabular-nums;user-select:all}
.maprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
a.btn{text-decoration:none;color:var(--ink)}
a.btn.primary{color:var(--accent-ink)}
.search{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px}

/* dialog */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:16px;box-shadow:var(--shadow);max-height:92%;overflow:auto}
dialog::backdrop{background:rgba(10,14,26,.5)}
@media (max-width:600px){ dialog{margin:auto 0 0;max-width:100%;border-radius:16px 16px 0 0} }
#frm{display:flex;flex-direction:column;gap:14px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dhead h3{font-family:var(--display);font-size:20px;margin:0}
#frmBody{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.irow input,.irow select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.irow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,1fr) 42px;gap:6px}
.irow.noprice{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 42px}
.rows{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px}
.totalline{display:flex;justify-content:space-between;font-weight:700;padding:8px 0;border-top:1px solid var(--line)}
.err{color:var(--debt);font-size:13px;margin:0}
.dfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dfoot .btn.primary{flex:1;min-width:140px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){ .btn,.row,.tab{transition:background-color .12s,border-color .12s,color .12s} }
</style>
<style>
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
#gate.nofields .field,#gate.nofields .btn{display:none}
</style>
</head>
<body>
<div id="gate" hidden>
  <form id="gateForm" class="gate-card" novalidate>
    <div class="brand">Chuchvara daftari</div>
    <p id="gateMsg" class="hint" role="status"></p>
    <div class="field"><label for="g-email">Login yoki email</label><input id="g-email" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label for="g-pass">PIN-kod yoki parol</label><input id="g-pass" type="password" autocomplete="current-password"></div>
    <button type="submit" class="btn primary" id="g-btn">Kirish</button>
  </form>
</div>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">Chuchvara daftari</div>
    <div class="status" id="status" role="status"></div>
  </div>
  <nav class="tabs" aria-label="Bo'limlar"><div class="wrap tabs-in" id="tabs"></div></nav>
</header>
<main class="wrap" id="view"></main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="frm" novalidate>
    <div class="dhead"><h3 id="dlgTitle"></h3><button type="button" class="icon-btn" data-close aria-label="Yopish">×</button></div>
    <div id="frmBody"></div>
    <p class="err" id="frmErr" hidden></p>
    <div class="dfoot">
      <button type="button" class="btn danger" id="frmDel" data-del hidden>O'chirish</button>
      <button type="submit" class="btn primary" id="frmSave">Saqlash</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="pwa.js"></script>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sp = s => s.replace(/[  ]/g, " ");
const fmt = n => sp((Math.round(+n) || 0).toLocaleString("ru-RU"));
const fq = n => sp((+n || 0).toLocaleString("ru-RU", { maximumFractionDigits: 2 }));
const num = s => { const v = parseFloat(String(s ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(v) ? v : 0; };
const iso = dt => new Date(dt.getTime() - dt.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const today = () => iso(new Date());
const dm = d => d ? d.slice(8, 10) + "." + d.slice(5, 7) + "." + d.slice(0, 4) : "";
const dshort = d => d ? d.slice(8, 10) + "." + d.slice(5, 7) : "—";
const shiftDay = (d, n) => { const t = new Date(d + "T12:00:00"); t.setDate(t.getDate() + n); return iso(t); };
const shiftMonth = (m, n) => { const t = new Date(m + "-15T12:00:00"); t.setMonth(t.getMonth() + n); return iso(t).slice(0, 7); };
const MONTHS = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "Iyun", "Iyul", "Avgust", "Sentabr", "Oktabr", "Noyabr", "Dekabr"];
const monthName = m => MONTHS[+m.slice(5, 7) - 1] + " " + m.slice(0, 4);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const TYPES = {
  d: { label: "Yuk", title: "Do'konga yuk berish" },
  p: { label: "To'lov", title: "Do'kondan pul olish" },
  r: { label: "Vozvrat", title: "Vozvrat (qaytgan mahsulot)" },
  m: { label: "Chiqdi", title: "Mahsulot ishlab chiqarildi" },
  b: { label: "Xarid", title: "Xomashyo sotib olish" },
  u: { label: "Sarf", title: "Xomashyo sarfi" },
  x: { label: "Xarajat", title: "Xarajat" },
  w: { label: "Ish haqi", title: "Ish haqi yozish" },
  v: { label: "Berildi", title: "Ishchiga pul berish" }
};
const CATS = ["Ijara", "Kommunal (gaz, svet, suv)", "Transport, benzin", "Qadoq, paket", "Soliq", "Ta'mirlash", "Boshqa"];
const METHODS = ["Naqd", "Karta", "O'tkazma"];
const REFS = {
  shops: { one: "Do'kon", add: "Do'kon qo'shish" },
  products: { one: "Mahsulot", add: "Mahsulot qo'shish" },
  materials: { one: "Xomashyo", add: "Xomashyo turini qo'shish" },
  workers: { one: "Ishchi", add: "Ishchi qo'shish" }
};
const PW = () => window.DAFTAR_PWA || null;
const can = p => !PW() || !PW().perms || PW().perms.includes("all") || PW().perms.includes(p);
const isOwner = () => !PW() || !PW().perms || !!PW().owner || PW().perms.includes("all");
const isBoss = () => !!PW() && !!PW().owner;
const logEv = (act, kind, text, was) => { const P = PW(); if (P && P.log) P.log({ act, kind, text: String(text || ""), was: String(was || "") }); };
const TPERM = { d: "sales", p: "sales", r: "sales", m: "prod", b: "stock", u: "stock", x: "exp", w: "wages", v: "wages" };
const canT = t => can(TPERM[t]);
const PERMS = [["all", "To'liq huquq: hamma bo'limlar, hisobot, narxlar, o'chirish"], ["sales", "Do'konlar: yuk, to'lov, vozvrat, qarzlar"], ["prod", "Ishlab chiqarish"], ["stock", "Xomashyo: xarid va sarf"], ["exp", "Xarajatlar"], ["wages", "Ishchilar va ish haqi"]];
const VIEWOK = { bugun: () => true, dokonlar: () => can("sales"), sklad: () => can("prod") || can("stock"), ishchilar: () => can("wages"), xarajatlar: () => can("exp"), hisobot: isOwner, tarix: isBoss, sozlama: () => isOwner() || !!PW() };
const QUICK = [["d", "+", "Yuk berdim"], ["p", "$", "Pul oldim"], ["r", "↩", "Vozvrat"], ["m", "✓", "Mahsulot chiqdi"], ["b", "▣", "Xomashyo oldim"], ["u", "−", "Xomashyo sarfi"], ["x", "−", "Xarajat"], ["v", "→", "Ishchiga pul"]];
const VIEWS = [["bugun", "Bugun"], ["dokonlar", "Do'konlar"], ["sklad", "Sklad"], ["ishchilar", "Ishchilar"], ["xarajatlar", "Xarajatlar"], ["hisobot", "Hisobot"], ["tarix", "Tarix"], ["sozlama", "Sozlamalar"]];

const S = {
  db: null, dl: null, noDb: false, ready: false, slow: false, stale: false, canWrite: true, dead: false,
  loaded: {}, known: new Set(), jSize: {},
  ref: { shops: {}, products: {}, materials: {}, workers: {} }, entries: [],
  log: null, logBusy: false, logErr: false, logWho: "",
  view: "bugun", day: today(), month: today().slice(0, 7), shopId: null, workerId: null, q: ""
};
let D = { shop: {}, prod: {}, mat: {}, wrk: {}, lastPr: {} };
let F = null;

/* ---------- derived numbers ---------- */
const sumItems = e => (e.i || []).reduce((a, r) => a + (+r.q || 0) * (+r.pr || 0), 0);
const amt = e => "drb".includes(e.t) ? sumItems(e) : (+e.a || 0);
function compute() {
  const d = { shop: {}, prod: {}, mat: {}, wrk: {}, lastPr: {} };
  const sh = id => d.shop[id] || (d.shop[id] = { bal: 0, lastD: "", lastP: "" });
  const mt = id => d.mat[id] || (d.mat[id] = { q: 0, pr: null });
  for (const [id, s] of Object.entries(S.ref.shops)) sh(id).bal = +s.open || 0;
  for (const e of S.entries) {
    const a = amt(e);
    if (e.t === "d") { const s = sh(e.s); s.bal += a; s.lastD = e.d; for (const r of e.i || []) { d.prod[r.p] = (d.prod[r.p] || 0) - (+r.q || 0); d.lastPr[e.s + "|" + r.p] = r.pr; } }
    else if (e.t === "p") { const s = sh(e.s); s.bal -= a; s.lastP = e.d; }
    else if (e.t === "r") { sh(e.s).bal -= a; if (e.st) for (const r of e.i || []) d.prod[r.p] = (d.prod[r.p] || 0) + (+r.q || 0); }
    else if (e.t === "m") { for (const r of e.i || []) d.prod[r.p] = (d.prod[r.p] || 0) + (+r.q || 0); }
    else if (e.t === "b") { for (const r of e.i || []) { const m = mt(r.p); m.q += +r.q || 0; m.pr = r.pr; } }
    else if (e.t === "u") { for (const r of e.i || []) mt(r.p).q -= +r.q || 0; }
    else if (e.t === "w") d.wrk[e.w] = (d.wrk[e.w] || 0) + a;
    else if (e.t === "v") d.wrk[e.w] = (d.wrk[e.w] || 0) - a;
  }
  D = d;
}
const rname = (cat, id) => S.ref[cat][id]?.name || "(o'chirilgan)";
const runit = (cat, id) => S.ref[cat][id]?.unit || "";
const active = (cat, keep) => Object.entries(S.ref[cat]).filter(([id, x]) => x && (!x.del || id === keep)).sort((a, b) => String(a[1].name).localeCompare(String(b[1].name)));
const catOf = t => "bu".includes(t) ? "materials" : "products";
function itemsText(e, withPrice) {
  const cat = catOf(e.t);
  return (e.i || []).map(r => `${rname(cat, r.p)} ${fq(r.q)} ${runit(cat, r.p)}${withPrice ? " × " + fmt(r.pr) : ""}`).join(", ");
}
function qtyByUnit(list) {
  const u = {};
  for (const e of list) for (const r of e.i || []) { const k = runit(catOf(e.t), r.p) || "dona"; u[k] = (u[k] || 0) + (+r.q || 0); }
  const parts = Object.entries(u).map(([k, v]) => `${fq(v)} ${k}`);
  return parts.length ? parts.join(" + ") : "—";
}
const neg = v => Math.round(v) ? "−" + fmt(v) : "0";
function parseLoc(raw) {
  const s = String(raw || "").trim(); if (!s) return null;
  let str = s; try { str = decodeURIComponent(s); } catch (e) {}
  const m = str.match(/(-?\d{1,3}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);
  if (m) { let a = +m[1], b = +m[2]; if (/yandex/i.test(str)) [a, b] = [b, a]; if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return { lat: a, lng: b }; }
  return /^https?:\/\//i.test(s) ? { url: s } : null;
}
function mapLinks(s) {
  const L = parseLoc(s.loc), a = (href, text, cls = "") => `<a class="btn small ${cls}" href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
  if (L && L.lat != null) { const c = L.lat + "," + L.lng; return a("https://www.google.com/maps/dir/?api=1&destination=" + c, "Google xaritada yo'l", "primary") + a("https://yandex.com/maps/?rtext=~" + c + "&rtt=auto", "Yandex xaritada yo'l"); }
  if (L && L.url) return a(L.url, "Xaritada ochish", "primary");
  if (s.addr) return a("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.addr), "Manzilni xaritadan qidirish") + `<span class="hint">Aniq lokatsiya kiritilmagan.</span>`;
  return `<span class="hint">Lokatsiya kiritilmagan. «Ma'lumotni tuzatish» orqali qo'shing.</span>`;
}
const callBtn = ph => window.DAFTAR_PWA ? `<a class="btn small" href="tel:${esc(String(ph).replace(/[^\d+]/g, ""))}">Qo'ng'iroq qilish</a>` : "";
function sumText(e) {
  const a = amt(e), who = e.s ? rname("shops", e.s) : e.w ? rname("workers", e.w) : e.t === "x" ? e.c : e.t === "b" ? e.sup : "";
  return [dm(e.d), who, e.i ? itemsText(e, "drb".includes(e.t)) : "", a ? fmt(a) + " so'm" : "", e.m, e.n].filter(Boolean).join(" · ");
}
const refText = x => [x.name, x.price ? fmt(x.price) + " so'm" : "", x.open ? "boshlang'ich qarz " + fmt(x.open) : "", x.phone, x.addr].filter(Boolean).join(" · ");
const sumOf = (list, t) => list.filter(e => e.t === t).reduce((a, e) => a + amt(e), 0);

/* ---------- rows ---------- */
function rowHTML(e, showDate) {
  let title = "", detail = "", val = "", cls = "";
  const a = amt(e);
  switch (e.t) {
    case "d": title = rname("shops", e.s); detail = itemsText(e, true); val = "+" + fmt(a); break;
    case "p": title = rname("shops", e.s); detail = e.m || ""; val = "−" + fmt(a); cls = "paid"; break;
    case "r": title = rname("shops", e.s); detail = itemsText(e, true) + (e.st ? " · skladga qaytdi" : " · yaroqsiz"); val = "−" + fmt(a); cls = "debt"; break;
    case "m": title = "Ishlab chiqarildi"; detail = itemsText(e, false); val = qtyByUnit([e]); cls = "paid"; break;
    case "b": title = e.sup || "Xomashyo xaridi"; detail = itemsText(e, true); val = fmt(a); break;
    case "u": title = "Xomashyo sarflandi"; detail = itemsText(e, false); break;
    case "x": title = e.c || "Xarajat"; val = fmt(a); break;
    case "w": title = rname("workers", e.w); detail = "ish haqi hisoblandi"; val = "+" + fmt(a); break;
    case "v": title = rname("workers", e.w); detail = "pul berildi"; val = "−" + fmt(a); cls = "paid"; break;
  }
  if (e.n) detail += (detail ? " · " : "") + e.n;
  if (PW() && isOwner() && e.by) detail += (detail ? " · " : "") + "kiritdi: " + e.by + (e.eb && e.eb !== e.by ? ", tuzatdi: " + e.eb : "");

  const inner = `<span class="pill t-${e.t}">${TYPES[e.t].label}</span><span class="row-main"><b>${esc(title)}</b>${detail ? `<small>${esc(detail)}</small>` : ""}</span><span class="row-val ${cls}">${esc(val)}</span>`;

function viewHisobot() {
  const m = S.entries.filter(e => e.d.startsWith(S.month));
  const sold = sumOf(m, "d"), ret = sumOf(m, "r"), paid = sumOf(m, "p"), buy = sumOf(m, "b"), wage = sumOf(m, "w"), wpaid = sumOf(m, "v"), exp = sumOf(m, "x");
  const net = sold - ret, profit = net - buy - wage - exp, end = S.month + "-31";
  const shopsAgg = {};
  const sa = id => shopsAgg[id] || (shopsAgg[id] = { d: 0, r: 0, p: 0, bal: +(S.ref.shops[id]?.open) || 0 });
  for (const id of Object.keys(S.ref.shops)) sa(id);
  for (const e of S.entries) if ("dpr".includes(e.t) && e.d <= end) { const x = sa(e.s), a = amt(e); x.bal += e.t === "d" ? a : -a; if (e.d.startsWith(S.month)) x[e.t] += a; }
  const shopRowsH = Object.entries(shopsAgg).filter(([, x]) => x.d || x.r || x.p || Math.abs(x.bal) > 0.5).sort((a, b) => b[1].bal - a[1].bal);
  const debtEnd = shopRowsH.reduce((a, [, x]) => a + Math.max(0, x.bal), 0);

  for (const e of m) if ("mdr".includes(e.t)) for (const r of e.i || []) { const x = pa[r.p] || (pa[r.p] = { m: 0, d: 0, r: 0 }); x[e.t] += +r.q || 0; }

/* ---------- store ---------- */
let chain = Promise.resolve();
const enqueue = fn => { const p = chain.then(fn); chain = p.catch(() => {}); return p; };
async function putRaw(coll, docId, id, val) {
  const key = coll + "/" + docId, ref = S.db.doc(key);
  if (S.known.has(key)) {
    try { await ref.update({ e: { [id]: val } }); }
    catch (err) { if (err && err.code === "invalid_argument" && val !== null && !(await ref.get()).exists) { await ref.set({ e: { [id]: val } }); } else throw err; }
  } else if (val !== null) { await ref.set({ e: { [id]: val } }); S.known.add(key); }
}
const put = (coll, docId, id, val) => enqueue(async () => {
  try { await putRaw(coll, docId, id, val); }
  catch (err) { if (err && err.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await putRaw(coll, docId, id, val); } else throw err; }
});
function pickShard(ym, t) {
  const base = ym + "_" + t;
  const shards = Object.keys(S.jSize).filter(k => k === base || k.startsWith(base + "_")).sort((a, b) => (+a.split("_")[2] || 1) - (+b.split("_")[2] || 1));
  if (!shards.length) return base;
  const last = shards[shards.length - 1];
  return S.jSize[last] > 180000 ? base + "_" + ((+last.split("_")[2] || 1) + 1) : last;
}
async function saveEntry(t, entry, ex) {
  const id = ex ? ex.id : newId(), ym = entry.d.slice(0, 7);
  const docId = ex && ex._doc.startsWith(ym + "_" + t) ? ex._doc : pickShard(ym, t);
  if (ex && ex._doc !== docId) await put("j", ex._doc, id, null);
  await put("j", docId, id, entry);
}
function errText(err) {
  const c = err && err.code;
  if (c === "quota_exceeded") return "Daftarda joy to'ldi. Eski yozuvlarni yuklab olib, o'chirish kerak.";
  if (c === "invalid_argument") return "Sizda yozish huquqi yo'q yoki ma'lumot noto'g'ri.";
  if (c === "revoked" || c === "not_granted") return "Daftarga ruxsat yo'q. Sahifani qayta oching.";
  return "Saqlanmadi. Internetni tekshirib, qayta urinib ko'ring.";
}
function got(name, meta) {
  S.loaded[name] = true;
  if (S.loaded.j && S.loaded.ref) S.ready = true;
  if (!meta.fromCache) { clearTimeout(S.timer); S.slow = false; S.stale = false; }
  render();
}
function onDead() { clearTimeout(S.timer); S.dead = true; if (!S.ready) { S.ready = true; } render(); }
async function start() {
  const hv = location.hash.slice(1); if (VIEWFN[hv]) S.view = hv;
  render();
  const claude = window.claude;
  const db = claude && claude.use ? await claude.use("db") : null;
  if (!db) { S.noDb = true; render(); return; }
  S.db = db;
  S.timer = setTimeout(() => { if (S.ready) S.stale = true; else S.slow = true; render(); }, 10000);
  db.collection("ref").onSnapshot(snap => {
    const ref = { shops: {}, products: {}, materials: {}, workers: {} };
    for (const doc of snap.docs) { S.known.add("ref/" + doc.id); if (ref[doc.id]) for (const [id, x] of Object.entries((doc.data() || {}).e || {})) if (x) ref[doc.id][id] = x; }
    S.ref = ref; got("ref", snap.metadata);
  }, onDead);
  db.collection("j").onSnapshot(snap => {
    const arr = []; S.jSize = {};
    for (const doc of snap.docs) {
      const data = doc.data() || {}, t = doc.id.split("_")[1];
      S.known.add("j/" + doc.id); S.jSize[doc.id] = JSON.stringify(data).length;
      if (TYPES[t]) for (const [id, e] of Object.entries(data.e || {})) if (e && e.d) arr.push({ ...e, id, t, _doc: doc.id });
    }
    arr.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : (a.ts || 0) - (b.ts || 0));
    S.entries = arr; got("j", snap.metadata);
  }, onDead);
  claude.use("user").then(async u => { if (u && (await u.can("data.write")) === false) { S.canWrite = false; render(); } }).catch(() => {});
  claude.use("downloads").then(d => { if (d) { S.dl = d; if (S.ready && S.view === "hisobot") render(); } }).catch(() => {});
}

      if (PW()) { if (!ex) o.by = PW().name; else { if (ex.by) o.by = ex.by; o.eb = PW().name; } }

      logEv(ex ? "edit" : "add", TYPES[t].label, sumText(Object.assign({ t }, o)), ex ? sumText(ex) : "");
    }
  });
}
function refForm(cat, id) {
  const x = id ? S.ref[cat][id] || {} : {};
  let b = inp("r-name", cat === "shops" ? "Do'kon nomi" : cat === "workers" ? "Ism" : "Nomi", x.name || "", "required");
  if (cat === "shops") b += `<div class="two">${inp("r-owner", "Egasi yoki sotuvchi", x.owner || "")}${inp("r-phone", "Telefon", x.phone || "", 'inputmode="tel" placeholder="+998 90 123 45 67"')}</div>` + inp("r-addr", "Manzil", x.addr || "")
    + `<div class="field"><label for="r-loc">Lokatsiya (koordinata yoki xarita havolasi)</label><input id="r-loc" value="${esc(x.loc || "")}" placeholder="41.311081, 69.240562">
      ${window.DAFTAR_PWA ? `<div><button type="button" class="btn small" data-geo>Hozir turgan joyimni saqlash</button></div>` : ""}
      <span class="hint">${window.DAFTAR_PWA ? "Do'kon oldida turib tugmani bosing yoki " : ""}Google yoki Yandex xaritadan koordinata yoki havolani nusxalab qo'ying.</span></div>` + inp("r-open", "Boshlang'ich qarz, so'm (daftardagi eski qarzi)", x.open ?? "", 'inputmode="decimal" placeholder="0"') + inp("r-note", "Izoh", x.note || "");
  if (cat === "products") b += `<div class="two">${sel("r-unit", "O'lchov birligi", ["kg", "dona", "pachka", "quti"].map(u => [u, u]), x.unit || "kg")}${inp("r-price", "Sotuv narxi, so'm", x.price ?? "", 'inputmode="decimal" placeholder="0"')}</div>`;
  if (cat === "materials") b += sel("r-unit", "O'lchov birligi", ["kg", "dona", "litr", "qop", "pachka"].map(u => [u, u]), x.unit || "kg");
  if (cat === "workers") b += inp("r-phone", "Telefon", x.phone || "", 'inputmode="tel"') + inp("r-note", "Izoh (lavozimi, kunlik stavkasi)", x.note || "");
  openForm({
    title: (id ? "Tuzatish: " : "Yangi: ") + REFS[cat].one.toLowerCase(), body: b,
    delText: "Ro'yxatdan olib tashlash",
    onDelete: id && isOwner() ? async () => { await put("ref", cat, id, { ...x, del: true }); logEv("del", REFS[cat].one, refText(x)); if (S.shopId === id) S.shopId = null; if (S.workerId === id) S.workerId = null; } : null,
    submit: async () => {
      const o = { name: $("#r-name").value.trim() }; if (!o.name) throw "Nomini kiriting.";
      for (const k of ["owner", "phone", "addr", "note", "unit"]) if ($("#r-" + k)) o[k] = $("#r-" + k).value.trim();
      if ($("#r-loc")) { const raw = $("#r-loc").value.trim(), L = parseLoc(raw); if (raw && !L) throw "Lokatsiyani tushunmadim. Koordinata (41.311081, 69.240562) yoki xarita havolasini kiriting."; o.loc = L ? (L.url || L.lat.toFixed(6) + ", " + L.lng.toFixed(6)) : ""; }
      if ($("#r-open")) o.open = num($("#r-open").value);
      if ($("#r-price")) o.price = num($("#r-price").value);
      await put("ref", cat, id || newId(), o);
      logEv(id ? "edit" : "add", REFS[cat].one, refText(o), id ? refText(x) : "");
    }
  });
}
function userForm(uid) {
  const P = PW(), u = uid ? (P.users || []).find(x => x.uid === uid) || {} : {};
  let b = inp("u-name", "Ism", u.name || "");
  b += uid ? `<p class="hint">Login: <b>${esc(u.login)}</b>. Login va PIN o'zgarmaydi. PIN unutilsa, ruxsatni olib qo'yib, xodimni boshqa login bilan qayta qo'shing.</p>`
    : `<div class="two">${inp("u-login", "Login (lotin harflarida)", "", 'autocapitalize="none" autocomplete="off" placeholder="sardor"')}${inp("u-pin", "PIN-kod (6 ta raqam)", "", 'inputmode="numeric" autocomplete="off" maxlength="12" placeholder="482913"')}</div>`;
  b += `<div class="field"><span class="flabel">Qaysi bo'limlar ochiq</span>${PERMS.map(([k, t]) => `<label class="check"><input type="checkbox" class="u-perm" id="u-perm-${k}" value="${k}" ${(u.perms || []).includes(k) ? "checked" : ""}> ${t}</label>`).join("")}</div>
    <p class="hint">Belgilanmagan bo'limlar xodimga ko'rinmaydi. «To'liq huquq» berilsa, u hamma bo'limni, hisobotni va narxlarni ko'radi, yozuvni o'chira oladi. Xodimlar ro'yxati va Tarix faqat sizda.</p>`;
  openForm({
    title: uid ? "Xodim ruxsatlari" : "Yangi xodim", body: b, delText: "Ruxsatni olib qo'yish",
    onDelete: uid ? () => P.removeUser(uid) : null,
    submit: async () => {
      const o = { uid, name: $("#u-name").value.trim(), perms: $$(".u-perm").filter(c => c.checked).map(c => c.value) };
      if (o.perms.includes("all")) o.perms = ["all"];
      if (!o.name) throw "Ismni kiriting.";
      if (!uid) {
        o.login = $("#u-login").value.trim().toLowerCase(); o.pin = $("#u-pin").value.trim();
        if (!/^[a-z0-9._-]{3,20}$/.test(o.login)) throw "Login 3 tadan 20 tagacha lotin harfi yoki raqamdan iborat bo'lsin.";
        if (!/^\d{6,12}$/.test(o.pin)) throw "PIN kamida 6 ta raqam bo'lsin.";
      }
      if (!o.perms.length) throw "Kamida bitta bo'limni belgilang.";
      await P.saveUser(o);
    }
  });
}
$("#frm").addEventListener("submit", async ev => {
  ev.preventDefault(); if (!F || !F.submit) return;
  const sv = $("#frmSave"), er = $("#frmErr"); sv.disabled = true; er.hidden = true;
  try { await F.submit(); dlg.close(); toast("Saqlandi"); }
  catch (err) { er.textContent = typeof err === "string" ? err : errText(err); er.hidden = false; }
  sv.disabled = false;
});
$("#frm").addEventListener("input", ev => { if (ev.target.classList.contains("i-pr")) delete ev.target.dataset.auto; updateTotal(); });
$("#frm").addEventListener("change", ev => { if (ev.target.classList.contains("i-p") || ev.target.id === "f-s") refreshPrices(); updateTotal(); });
dlg.addEventListener("close", () => { F = null; });

/* ---------- export ---------- */
async function exportCsv() {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [["Sana", "Turi", "Kim / nima", "Nomi", "Miqdor", "Birlik", "Narx", "Summa", "Izoh"].map(q).join(";")];
  for (const e of S.entries) {
    const who = e.s ? rname("shops", e.s) : e.w ? rname("workers", e.w) : e.t === "x" ? e.c : e.t === "b" ? e.sup : "";
    const note = [e.m, e.t === "r" ? (e.st ? "skladga qaytdi" : "yaroqsiz") : "", e.n].filter(Boolean).join(", ");
    if (e.i) for (const r of e.i) lines.push([dm(e.d), TYPES[e.t].label, who, rname(catOf(e.t), r.p), String(r.q).replace(".", ","), runit(catOf(e.t), r.p), r.pr ?? "", r.pr != null ? Math.round(r.q * r.pr) : "", note].map(q).join(";"));
    else lines.push([dm(e.d), TYPES[e.t].label, who, "", "", "", "", Math.round(e.a || 0), note].map(q).join(";"));
  }
  try { await S.dl.save({ filename: "chuchvara-daftari-" + today() + ".csv", data: "﻿" + lines.join("\r\n") }); toast("Fayl tayyor"); }
  catch (err) { if (!err || err.code !== "declined") toast("Faylni yuklab bo'lmadi"); }
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-nav],[data-add],[data-edit],[data-open],[data-back],[data-ref],[data-day],[data-month],[data-copy],[data-close],[data-add-row],[data-rm-row],[data-del],[data-export],[data-geo],[data-logout],[data-user],[data-reload-log]");
  if (!el) return;
  const ds = el.dataset;
  if ("nav" in ds) go(ds.nav);
  else if ("add" in ds) entryForm(ds.add, { s: ds.s, w: ds.w });
  else if ("edit" in ds) { const e = S.entries.find(x => x.id === ds.edit); if (e) entryForm(e.t, {}, e); }
  else if ("open" in ds) { const [cat, id] = ds.open.split(":"); if (cat === "shops") S.shopId = id; else S.workerId = id; render(); window.scrollTo(0, 0); }
  else if ("back" in ds) { S.shopId = S.workerId = null; render(); }
  else if ("ref" in ds) refForm(ds.ref, ds.id);
  else if ("day" in ds) { S.day = shiftDay(S.day, +ds.day); render(); }
  else if ("month" in ds) { S.month = shiftMonth(S.month, +ds.month); render(); }
  else if ("close" in ds) dlg.close();
  else if ("addRow" in ds) { $("#f-rows").insertAdjacentHTML("beforeend", itemRow(catOf(F.t), F.hasPrice, {})); refreshPrices(); updateTotal(); }
  else if ("rmRow" in ds) { if ($$("#frmBody .irow").length > 1) el.closest(".irow").remove(); updateTotal(); }
  else if ("export" in ds) exportCsv();
  else if ("logout" in ds) window.DAFTAR_PWA.logout();
  else if ("user" in ds) userForm(ds.user || null);
  else if ("reloadLog" in ds) { loadLog(); render(); }
  else if ("geo" in ds) {
    const er = $("#frmErr"), label = el.textContent, fail = () => { el.disabled = false; el.textContent = label; er.textContent = "Joylashuvni aniqlab bo'lmadi. Telefonda joylashuvga ruxsat bering yoki xarita havolasini qo'ying."; er.hidden = false; };
    if (!navigator.geolocation) return fail();
    el.disabled = true; el.textContent = "Aniqlanmoqda…";
    navigator.geolocation.getCurrentPosition(pos => { $("#r-loc").value = pos.coords.latitude.toFixed(6) + ", " + pos.coords.longitude.toFixed(6); el.disabled = false; el.textContent = label; er.hidden = true; }, fail, { enableHighAccuracy: true, timeout: 15000 });
  }
  else if ("copy" in ds) {
    try { await navigator.clipboard.writeText(ds.copy); toast("Nusxa olindi"); }
    catch (e) { const c = el.parentElement.querySelector("code"); if (c) { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Raqam belgilandi, nusxa oling"); }
  }
  else if ("del" in ds) {
    if (!F || !F.onDelete) return;
    if (!ds.armed) { ds.armed = "1"; el.textContent = "Rostdan ham? Yana bir marta bosing"; return; }
    el.disabled = true;
    try { await F.onDelete(); dlg.close(); toast("O'chirildi"); render(); }
    catch (err) { const er = $("#frmErr"); er.textContent = errText(err); er.hidden = false; }
    el.disabled = false;
  }
});
document.addEventListener("change", ev => { if (ev.target.id === "dayPick" && ev.target.value) { S.day = ev.target.value; render(); } if (ev.target.id === "logWho") { S.logWho = ev.target.value; render(); } });
document.addEventListener("input", ev => { if (ev.target.id === "shopSearch") { S.q = ev.target.value; $("#shopList").innerHTML = shopRows(); } });
window.addEventListener("hashchange", () => { const hv = location.hash.slice(1); if (VIEWFN[hv] && VIEWOK[hv]() && hv !== S.view) { S.view = hv; S.shopId = S.workerId = null; render(); } });
start();
